<!DOCTYPE html>
    <head>
        <title>Mini Pokedex</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="frame">
            <h1 class="title">Bits of Good Mid-Semester Project</h1>
            <div class="image_box">
                <img id="item_image" src="" alt="Pokemon">
            </div>
            <div id="item_name" class="name_box"></div>
            <div class="types">
                <p class="types_label">Types:</p>
                <div id="item_types"></div>
            </div>
            <div class="nav">
                <button id="previous">&lt;</button>
                <button id="next">&gt;</button>
            </div>
            <div class="right">
                <h2 id="panel_title">Info</h2>
                <div id="display_box"></div>
                <div class="tabs">
                    <button id="info_button">Info</button>
                    <button id="moves_button">Moves</button>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
